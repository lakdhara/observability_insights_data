      scenarios); rule-based security_detector may miss semantic prompt-injection
  agentloupe:
    intent: 2
    action: 2
    corr: 2
    detect: 1
    note: 'label propagation gives exact intent->resource provenance edges; provenance only: supplies
      ground-truth (label,resource) edges but needs a policy/query to ALERT'
  alibaba_oss:
    intent: 2
    action: 2
    corr: 0
